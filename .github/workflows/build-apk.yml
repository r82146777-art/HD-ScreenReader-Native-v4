name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --list || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: List outputs
        if: always()
        run: find . -name "*.apk" -o -name "*.aab" | head -20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HD-ScreenReader-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
